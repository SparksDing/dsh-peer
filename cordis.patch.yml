# dsh-peer bundle layer: two disabled rows, enabled per deployment role.
# A hub listens; a link dials one hub and serves that hub this harness.
- insert:
    - id: peer-hub
      name: 'dsh-peer'
      disabled: true
      config:
        role: hub
        name: hub
        listen:
          host: 0.0.0.0
          port: 3099
        token: ''

    - id: peer-link
      name: 'dsh-peer'
      disabled: true
      config:
        role: link
        name: link
        token: ''
        connect:
          url: 'tcp://127.0.0.1:3099'
